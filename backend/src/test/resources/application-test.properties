# Test profile: in-memory H2 (MySQL compatibility mode) so `mvnw test`
# runs without a live MySQL instance. Production/container runtime keeps
# MySQL via the default application.properties.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Analytics service is out of scope for backend tests; point it somewhere inert.
analytics.service.url=http://localhost:9

# Ollama is out of scope for backend tests too.
ollama.base-url=http://localhost:9