spring.application.name=backend

# ===== Server =====
server.port=${SERVER_PORT:8080}

# ===== MySQL DataSource (values injected via environment variables / .env) =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dataanalytics}
spring.datasource.username=${DB_USERNAME:dataanalytics_user}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# Flyway owns the schema (see db/migration); Hibernate only maps. The env
# override exists for legacy setups but the default is "none".
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
# Lazy associations are only ever read inside explicit service transactions, so
# no proxy session may outlive a request (OSIV off for connection hygiene).
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ===== Flyway =====
# Fresh databases run V1__init.sql end-to-end. Databases that already exist
# (created by an earlier ddl-auto=update) have no flyway history, so Flyway
# baselines them and skips V1 instead of failing on "table already exists".
spring.flyway.baseline-on-migrate=true

# ===== Analytics service =====
analytics.service.url=${ANALYTICS_SERVICE_URL:http://localhost:8000}
# Transient failures (connection errors, HTTP 5xx) are retried with
# exponential backoff (500ms, 1s, 2s, ... capped at 10s). 4xx are never
# retried. Set max-attempts=1 to disable retries.
analytics.client.retry.max-attempts=${ANALYTICS_RETRY_MAX_ATTEMPTS:3}
analytics.client.retry.backoff-millis=${ANALYTICS_RETRY_BACKOFF_MILLIS:500}

# ===== Ollama (AI assistant) =====
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3.2:3b}
ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:180}

# ===== JWT =====
jwt.secret=${JWT_SECRET:dev-only-jwt-secret-key-change-me-in-production-min-32-bytes}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ===== File uploads =====
file.storage-path=${FILE_STORAGE_PATH:./uploads}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:25MB}
